name: Supabase Keep-Alive

# Verhindert dass das kostenlose Supabase-Projekt nach 7 Tagen Inaktivität
# automatisch pausiert wird. Feuert alle 3 Tage einen minimalen REST-Call
# gegen die plans-Tabelle — reicht Supabase als "Aktivität" aus.

on:
  schedule:
    - cron: '30 11 */3 * *'
  workflow_dispatch: # ermöglicht manuellen Trigger via GitHub-UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hrmkpwiwdmsuosdyehwq.supabase.co/rest/v1/plans?select=id&limit=1" \
            -H "apikey: sb_publishable_noGwk7sJrpok8MsGgiFcLQ_YKeNK5wV" \
            -H "Authorization: Bearer sb_publishable_noGwk7sJrpok8MsGgiFcLQ_YKeNK5wV")
          echo "HTTP Status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 206 ]; then
            echo "✅ Supabase-Projekt ist aktiv"
            exit 0
          else
            echo "❌ Unerwarteter Status-Code: $RESPONSE"
            exit 1
          fi
